name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Tests
      run: |
        build\bin\Release\update_tests.exe
        build\bin\Release\updater_tests.exe

    - name: Smoke Test LauncherJX.exe
      shell: pwsh
      run: |
        $exe = (Resolve-Path 'build\bin\Release\LauncherJX.exe').Path
        $p = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 5
        if ($p.HasExited) {
            if ($p.ExitCode -ne 0) {
                throw "LauncherJX.exe exited with code $($p.ExitCode)"
            }
        } else {
            Stop-Process -Id $p.Id -Force
        }

    - name: Smoke Test updater.exe
      shell: pwsh
      run: |
        $root = (Resolve-Path '.').Path
        $smoke = Join-Path $root 'build\smoke-updater'
        $oldDir = Join-Path $smoke 'old'
        $newDir = Join-Path $smoke 'new'
        if (Test-Path $smoke) {
            Remove-Item -Recurse -Force $smoke
        }
        New-Item -ItemType Directory -Force -Path $oldDir, $newDir | Out-Null

        Copy-Item 'build\bin\Release\LauncherJX.exe' (Join-Path $oldDir 'current.exe')
        Copy-Item 'build\bin\Release\LauncherJX.exe' (Join-Path $newDir 'new.exe')
        Copy-Item 'version.json' (Join-Path $newDir 'version.json')

        $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $newDir 'new.exe')).Hash.ToLowerInvariant()
        $dummy = Start-Process -FilePath $env:ComSpec -ArgumentList '/c','ping 127.0.0.1 -n 2 >nul' -PassThru -WindowStyle Hidden
        $updater = Resolve-Path 'build\bin\Release\updater.exe'
        $args = @(
            '--launcher-pid', $dummy.Id,
            '--current', (Join-Path $oldDir 'current.exe'),
            '--new', (Join-Path $newDir 'new.exe'),
            '--expected-hash', $hash,
            '--launch', (Join-Path $oldDir 'current.exe')
        )

        $p = Start-Process -FilePath $updater -ArgumentList $args -PassThru -WindowStyle Hidden
        try {
            Wait-Process -Id $p.Id -Timeout 20
        } catch {
        }

        if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
            throw 'updater.exe timed out'
        }

        if ($p.ExitCode -ne 0) {
            throw "updater.exe exited with code $($p.ExitCode)"
        }

        Stop-Process -Id $dummy.Id -ErrorAction SilentlyContinue

        Get-Process LauncherJX, current, new -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($smoke, [System.StringComparison]::OrdinalIgnoreCase) } |
            Stop-Process -Force -ErrorAction SilentlyContinue

        Remove-Item -Recurse -Force $smoke

    - name: Get Tag Message
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $msg = git tag -l --format='%(contents)' $tag
        if ([string]::IsNullOrEmpty($msg)) {
            $msg = git log -1 --format=%B
        }
        $msg | Out-File -FilePath tag_message.txt -Encoding utf8

    - name: Generate Manifest and Package Zips
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        python tools/generate_manifest.py $tag --updater-path build/bin/Release/updater.exe --launcher-path build/bin/Release/LauncherJX.exe

    - name: Verify release tag still points to this commit
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $expected = "${{ github.sha }}"
        $refs = git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}"

        if (-not $refs) {
            throw "Could not resolve remote tag $tag"
        }

        $escapedTag = [regex]::Escape($tag)
        $peeledRef = $refs | Where-Object { $_ -match "refs/tags/$escapedTag\^\{\}$" } | Select-Object -First 1
        $directRef = $refs | Where-Object { $_ -match "refs/tags/$escapedTag$" } | Select-Object -First 1
        $selectedRef = if ($peeledRef) { $peeledRef } else { $directRef }

        if (-not $selectedRef) {
            throw "Could not parse remote tag $tag from git ls-remote output"
        }

        $actual = ($selectedRef -split "\s+")[0]
        if ($actual -ne $expected) {
            throw "Tag $tag moved during release. Expected $expected but remote points to $actual. Refusing to upload assets."
        }

        Write-Host "Remote tag $tag still points to $expected."

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body_path: tag_message.txt
        draft: false
        prerelease: false
        overwrite_files: false
        fail_on_unmatched_files: true
        files: |
          build/bin/Release/LauncherJX.exe
          build/bin/Release/updater.exe
          version.json
          patch/settings/serverlist.ini
          zips/root.zip
          zips/data.zip
          zips/script.zip
          zips/settings.zip
          zips/spr.zip
          zips/ui.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-version:
    name: Sync version.json to main
    needs: build
    runs-on: windows-latest

    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Verify tag comes from main
      id: verify
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $tagCommit = (git rev-list -n 1 $tag).Trim()
        if (-not $tagCommit) {
          throw "Could not resolve commit for tag $tag"
        }

        git merge-base --is-ancestor $tagCommit HEAD
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tag $tag is not on main. Skip syncing version.json."
          "allowed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
        }

        "allowed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Download version.json from release
      if: steps.verify.outputs.allowed == 'true'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        $headers = @{
          Authorization = "Bearer $env:GITHUB_TOKEN"
          Accept = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        $releaseUrl = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$env:TAG_NAME"
        $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
        $asset = $release.assets | Where-Object { $_.name -eq 'version.json' } | Select-Object -First 1

        if (-not $asset) {
          throw "Could not find version.json asset for tag $env:TAG_NAME"
        }

        Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile version.json

    - name: Commit version.json
      if: steps.verify.outputs.allowed == 'true'
      shell: pwsh
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add version.json

        if (git diff --cached --quiet) {
          Write-Host "version.json is already up to date on main."
          exit 0
        }
        git commit -m "chore: sync version.json from $env:TAG_NAME [skip ci]"
        git pull origin main --rebase
        git push origin main
