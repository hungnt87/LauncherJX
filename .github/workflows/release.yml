name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Tests
      run: |
        build\bin\Release\update_tests.exe
        build\bin\Release\updater_tests.exe

    - name: Get Tag Message
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $msg = git tag -l --format='%(contents)' $tag
        if ([string]::IsNullOrEmpty($msg)) {
            $msg = git log -1 --format=%B
        }
        $msg | Out-File -FilePath tag_message.txt -Encoding utf8

    - name: Generate Manifest and Package Zips
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        
        # Cấu hình git user
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        $commitSha = git rev-parse HEAD
        
        # Fetch các nhánh để xác định nguồn gốc tag
        git fetch origin main:main
        git fetch origin dev:dev
        
        $branch = (git branch -r --contains $commitSha | Select-String -Pattern "origin/(main|dev)" | Select-Object -First 1)
        if ($branch) {
            $branchName = $branch.ToString().Trim().Replace("origin/", "")
            Write-Host "Tag $tag duoc tao tu nhanh: $branchName. Tien hanh checkout va commit nguoc lai."
            
            git checkout $branchName
            
            # Sinh manifest và zips mới
            python tools/generate_manifest.py $tag --updater-path build/bin/Release/updater.exe --launcher-path build/bin/Release/LauncherJX.exe
            
            # Commit va push version.json mới ngược lại nhánh
            git add version.json
            git commit -m "chore: release $tag - update version.json [skip ci]"
            git push origin $branchName
        } else {
            Write-Host "Khong tim thay nhanh main hoac dev phu hop. Chi sinh manifest cuc bo."
            python tools/generate_manifest.py $tag --updater-path build/bin/Release/updater.exe --launcher-path build/bin/Release/LauncherJX.exe
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body_path: tag_message.txt
        draft: false
        prerelease: false
        files: |
          build/bin/Release/LauncherJX.exe
          build/bin/Release/updater.exe
          version.json
          zips/root.zip
          zips/data.zip
          zips/script.zip
          zips/settings.zip
          zips/spr.zip
          zips/ui.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
